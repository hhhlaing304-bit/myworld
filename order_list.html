    <main>
        <h2 class="order-h2">Order Detail</h2>
        <form class="order_detail_container">

            <div class="order_detail">
                <div class="order-group">
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="order-group">
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <div class="order-group">
                    <input type="text" id="subject" name="phone" placeholder="phone" required>
                </div>
                <button type="submit" class="order_submit"><a href="order confirmed.html">ORDER</a></button>
            </div>
        </form>
    </main>
